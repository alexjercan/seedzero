# Scufris reads this file as a menu, not a workflow. Conventions are inferred
# when the request is silent. Agents run only when the request names them.

[conventions]
keywords = { tracking = "tatr", when = "on-request", evidence = "tasks/", workspace = "master", base = "master", toolchain = "nix develop", media = "untracked", publishing = "self-qa", attribution = "none" }
guidance = """
This is the Seed Zero YouTube Shorts studio, run by the agent for its own
channel. Follow AGENTS.md. Never touch the owner's main channel. Every
narrated claim must come from a measured simulation output recorded in the
owning task. Use Nix for Python and FFmpeg. Keep media and secrets out of
Git. Inspect rendered output before calling work done. Publishing policy:
upload private, publish after the agent's own QA pass (owner authorized
2026-08-30); never publish anything that fails the quality gate.
"""

[agents.produce]
description = "Produce the next Seed Zero short end to end and publish it after QA."
keywords = { harness = "claude", model = "Fable", thinking = "xhigh" }
guidance = """
Pick the strongest idea from docs/niche.md, then follow the produce-short
skill: measure the claim first, script from measured numbers only, verified
voice-over, seeded music, compose, inspect the contact sheet and frames at
full resolution, fix defects, upload private, publish after the QA pass.
Record all evidence in the owning Tatr task and update the files under
web/data/. If no claim is supported by a strong measured number, slip the
slot and say so.
"""

[agents.research]
description = "Research online trends in the niche and add measurable idea candidates to the backlog."
keywords = { harness = "claude", model = "Fable", thinking = "xhigh" }
guidance = """
Follow the research-trends skill: read docs/niche.md, run a handful of
focused web searches for trending subjects and formats in the sim-science
shorts space, and keep only ideas that a deterministic in-repo simulation
can turn into one measured surprising number. Append survivors to the
backlog in docs/niche.md and record queries, sources, and reasoning in a
Tatr task. Research feeds ideas only; narrated claims still come from
simulations measured in this repo.
"""

[agents.analytics]
description = "Pull YouTube stats and analytics, answer questions, refresh the status page."
keywords = { harness = "claude", model = "Opus", thinking = "medium" }
guidance = """
Use the token in secrets/ with the YouTube Data and Analytics APIs. Reads
cost about one quota unit each; keep it to a handful per run. Report subs,
views, per-video numbers, swipe-away and retention when available. Update
web/data/status.json, web/data/slate.json, and web/data/log.jsonl. Record
notable findings and any slate decisions they justify in a Tatr task.
"""

[agents.publish]
description = "QA and publish a pending private video, or fix its metadata."
keywords = { harness = "claude", model = "Opus", thinking = "medium" }
guidance = """
Inspect the processed video status, verify metadata against the project's
metadata.json, then flip visibility to public. Only operate on the Seed
Zero channel. Record the publish time and video id in the owning task.
"""

[briefings.morning]
description = "Refresh the channel numbers, report them, and say what today should make."
keywords = { harness = "claude", model = "Opus", thinking = "medium" }
guidance = """
Refresh the channel numbers first, then read the repository.

- Use the token in `secrets/` with the YouTube Data and Analytics APIs, through
  `python3`, the way the analytics agent does. Read the subscriber count, the
  total views, and the numbers for the videos already on the slate.
- Reads cost about one quota unit each. Keep the whole morning under ten of
  them. The day's 10,000 units belong to uploads and one QA-failure re-upload,
  so never upload, publish, or change anything on the channel from here.
- Write what you read into `web/data/status.json` and `web/data/slate.json` in
  the shape they already have, including `updated_at`. Leave
  `web/data/log.jsonl` alone: the produce and publish agents own that journal.
  Do not commit anything.
- If the token is missing or the API refuses, report the numbers already on
  disk, say how old `updated_at` is, and set `status` to `stale`. Never guess a
  number in place of one you could not read.
- Read `docs/niche.md` for the backlog and `web/data/log.jsonl` for what the
  last days actually did.

Report the channel first: subscribers, total views, and how the recent videos
are doing against each other. Say how many days since the last public video,
and name anything still private that is waiting on QA.

Then say what today should make. Give the number of shorts you think is right
for today, against the three-upload cadence and the quota day, and name the
ideas you would make them from. Choose them from the backlog in `docs/niche.md`
and from what the recent numbers say is working. This part is your judgement
and not a measurement, so say what you think and why in a few sentences. Keep
it short enough to read over coffee and concrete enough that the owner can
answer "yes, start".

Facts are numbers: subscribers, total views, days since the last publish,
videos waiting on QA, shorts proposed for today. Set `status` to `attention`
when the cadence has slipped or something is waiting on the owner, and `stale`
when the numbers could not be refreshed and what is on disk is old.
"""
